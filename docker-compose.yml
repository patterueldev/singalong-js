name: singalong-dev

services:
  server:
    container_name: singalong-dev-server
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://admin:admin@mongodb:27017/singalong?authSource=admin
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MEDIA_PROVIDER_API_KEY=${MEDIA_PROVIDER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=development
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-P@ssw0rd!}
    depends_on:
      - mongodb
      - minio
    volumes:
      - ./server/src:/app/server/src
      - /app/server/node_modules
      - /app/server/dist
    networks:
      - singalong-dev-network

  admin-app:
    container_name: singalong-dev-admin-app
    build:
      context: .
      dockerfile: admin-app/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./admin-app:/app/admin-app
      - /app/admin-app/node_modules
    networks:
      - singalong-dev-network

  controller-app:
    container_name: singalong-dev-controller-app
    build:
      context: .
      dockerfile: controller-app/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./controller-app:/app/controller-app
      - /app/controller-app/node_modules
    networks:
      - singalong-dev-network

  player-app:
    container_name: singalong-dev-player-app
    build:
      context: .
      dockerfile: player-app/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./player-app:/app/player-app
      - /app/player-app/node_modules
    networks:
      - singalong-dev-network

  mongodb:
    container_name: singalong-dev-mongodb
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin}
    volumes:
      - mongodb-dev-data:/data/db
    networks:
      - singalong-dev-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    container_name: singalong-dev-mongo-express
    image: mongo-express:latest
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-admin}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin}@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - singalong-dev-network

  minio:
    container_name: singalong-dev-minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-dev-data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - singalong-dev-network
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - server
    networks:
      - singalong-dev-network
    profiles:
      - optional

networks:
  singalong-dev-network:
    driver: bridge

volumes:
  mongodb-dev-data:
  minio-dev-data:
