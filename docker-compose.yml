version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/singalong
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MEDIA_PROVIDER_API_KEY=${MEDIA_PROVIDER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=development
    depends_on:
      - mongodb
      - minio
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    networks:
      - singalong-network

  admin-app:
    build:
      context: .
      dockerfile: admin-app/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./admin-app:/app/admin-app
      - /app/admin-app/node_modules
    networks:
      - singalong-network

  controller-app:
    build:
      context: .
      dockerfile: controller-app/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./controller-app:/app/controller-app
      - /app/controller-app/node_modules
    networks:
      - singalong-network

  player-app:
    build:
      context: .
      dockerfile: player-app/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./player-app:/app/player-app
      - /app/player-app/node_modules
    networks:
      - singalong-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin}
    volumes:
      - mongodb_data:/data/db
    networks:
      - singalong-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - singalong-network
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - server
    networks:
      - singalong-network
    profiles:
      - optional

volumes:
  mongodb_data:
  minio_data:

networks:
  singalong-network:
    driver: bridge
